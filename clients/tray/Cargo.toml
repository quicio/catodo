[package]
name = "catodo-tray"
version = "0.1.0"
edition = "2021"
description = "System tray client for Cátodo — pairs with the backend, exposes quick actions (modes, play/pause, volume) in the OS tray menu."
license = "MIT"
publish = false

[dependencies]
# Runtime + async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
futures-util = "0.3"

# URL parsing for CATODO_BACKEND_URL env
url = "2"

# HTTP / WS clients (no TLS for local LAN; can be added later)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tray + windowing (Tauri 2.x)
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }

# Token storage: keyring with a file fallback
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Open URLs from the menu
open = "5"

# Errors / logging
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

# Time helpers
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }