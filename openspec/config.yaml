schema: spec-driven

context: |
  Project: Cátodo — A multimedia shell for Linux, inspired by old CRT TVs.

  Concept:
  - The application turns any monitor into a "smart TV" controlled via API.
  - Each app is a "channel" (Spotify, YouTube, Browser, etc.).
  - The user never sees the Linux desktop, only Cátodo.
  - Minimalist, fast, designed to run 24/7.

  Tech stack:
  - Frontend: Electron (castLabs build in dev for Widevine), TypeScript, React, Vite
  - Backend: Python 3.12, FastAPI, Uvicorn
  - Package manager: uv (Python)
  - Communication: HTTP REST API + WebSocket for events
  - OS: Linux exclusively, runs as kiosk/fullscreen

  Architecture:
  - Clean Architecture (light, KISS)
  - Frontend: UI only
  - Backend: domain, channels (plugins), API, wallpapers, lyrics
  - Channels are independent plugins that implement a common interface.
  - Channel types: media (Spotify), web (YouTube, Movistar TV), app (Anime library).
  - User data lives at `~/.local/share/catodo/` (config overrides, wallpapers, future state).

  Conventions:
  - The system uses "channels" as the main abstraction.
  - Hotkeys: 1-4 switch channels (Ch1=Spotify, Ch2=YouTube, Ch3=Anime, Ch4=TV).
  - Hotkeys 5-6 are bound but reserved for future channels.
  - Modular: adding a new channel only requires creating a new plugin.
  - The project is in `~/projects/catodo/`.

rules:
  proposal:
    - Keep proposals under 500 words
    - Include a "Non-goals" section
  tasks:
    - Break tasks into chunks of max 2 hours
    - Each task should be independently testable
