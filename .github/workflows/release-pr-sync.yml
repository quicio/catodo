name: release-pr-sync

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

# Varios eventos (labeled/synchronize) pueden disparar dos syncs a la vez y
# uno pierde el push contra el otro. Se serializan por PR.
concurrency:
  group: release-pr-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync-lockfiles:
    if: >
      contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          # PAT para que el push del sync no deje los checks en action_required.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync lockfiles
        run: ./scripts/sync-version-locks.sh

      - name: Commit lockfile changes
        run: |
          if git diff --quiet -- frontend/package-lock.json rust/Cargo.lock clients/tray/Cargo.lock; then
            echo "Lockfiles already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json rust/Cargo.lock clients/tray/Cargo.lock
          git commit -m "chore: sync lockfiles for release"
          # release-please puede haber avanzado la rama mientras corría el sync.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rechazado (intento $attempt); rebaseando sobre el remoto"
            git pull --rebase --autostash || exit 1
            sleep 3
          done
          echo "no pude pushear el sync de lockfiles" >&2
          exit 1
