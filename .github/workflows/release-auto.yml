name: release-auto

# Fallback de publicación cuando release-please corre sin PAT.
#
# release-please crea siempre un Release *draft* con su tag (force-tag-creation).
# Con `RELEASE_PAT`, el push del tag dispara release.yml, que sube los assets y
# publica el draft. Sin PAT, los eventos de `GITHUB_TOKEN` no encadenan
# workflows; este workflow escucha la finalización de release-please
# (workflow_run) y llama a release.yml como workflow reutilizable.
#
# Si no hay ningún draft pendiente, no hace nada: evita recompilar cuando
# release-please solo abrió/actualizó el PR de release.
#
# `workflow_dispatch` con `force` reconstruye los assets del último release
# publicado.

on:
  workflow_run:
    workflows: [release-please]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Reconstruir los assets del último release publicado"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: release-auto
  cancel-in-progress: false

jobs:
  resolve:
    name: Ver si hay algo que publicar
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      pending: ${{ steps.check.outputs.pending }}
    steps:
      - name: Detectar PAT
        id: pat
        shell: bash
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -n "$RELEASE_PAT" ]; then
            printf 'configured=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'configured=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Leer el draft pendiente (o el último release con --force)
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force || 'false' }}
          PAT_CONFIGURED: ${{ steps.pat.outputs.configured }}
        run: |
          set -euo pipefail
          # Con PAT, el push del tag dispara release.yml directamente. Evitamos
          # duplicar el build; `--force` sigue permitiendo reconstruir a mano.
          if [ "$PAT_CONFIGURED" = "true" ] && [ "$FORCE" != "true" ]; then
            echo "RELEASE_PAT configurado: release.yml se dispara por el push del tag"
            printf 'pending=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$FORCE" = "true" ]; then
            tag=$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
          else
            # release-please crea un draft + tag por release. Buscamos el más
            # reciente que todavía no tenga assets subidos.
            tag=$(gh api "repos/$REPO/releases?per_page=100" \
              --jq '[.[] | select(.draft == true)] | sort_by(.created_at) | reverse | .[0].tag_name // empty' \
              2>/dev/null || true)
          fi
          if [ -z "$tag" ]; then
            echo "no hay drafts pendientes; nada que hacer"
            printf 'pending=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          assets=$(gh api "repos/$REPO/releases/tags/$tag" --jq '.assets | length')
          echo "draft pendiente: $tag ($assets assets)"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          if [ "$assets" -gt 0 ] && [ "$FORCE" != "true" ]; then
            echo "ya tiene artefactos; se omite"
            printf 'pending=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'pending=true\n' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Publicar artefactos de ${{ needs.resolve.outputs.tag }}
    needs: resolve
    if: needs.resolve.outputs.pending == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
