[project]
name = "catodo"
version = "0.1.0"
description = "Cátodo — multimedia shell backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.9",
    "pydbus>=0.3.2",
    "pygobject>=3.56.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catodo"]
