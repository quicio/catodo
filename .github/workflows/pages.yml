name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "install.sh"
      - "scripts/_desktop.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build installer
        # El comando de la web es `.../install.sh`: se publica el helper de
        # menú + el instalador de release, con una sola fuente de verdad.
        run: cat scripts/_desktop.sh install.sh > site/install.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
