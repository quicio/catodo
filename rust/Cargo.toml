[workspace]
resolver = "2"
members = [
    "crates/catodo-domain",
    "crates/catodo-platform",
    "crates/catodo-server",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Cátodo Project"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time", "process", "fs", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
thiserror = "2"
url = "2"
tokio-util = { version = "0.7", features = ["io"] }
mime_guess = "2"
tower-http = { version = "0.6", features = ["fs", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
qrcode = "0.14"
shlex = "1"
rumqttc = "0.24"
uuid = { version = "1", features = ["v4"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
