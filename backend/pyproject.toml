[project]
name = "catodo"
version = "0.4.3"
description = "Cátodo — multimedia shell backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.9",
    "qrcode>=8.2",
    "asyncio-mqtt>=0.16.2",
]

[project.optional-dependencies]
# MPRIS/DBus para el backend Python en Linux. El backend de release es Rust, que
# cubre MPRIS nativo; esto solo hace falta si se usa el fallback de desarrollo en
# Linux y se quiere el canal Spotify por DBus.
mpris = ["pygobject>=3.56.3 ; sys_platform == 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catodo"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]
packaging = [
    "pyinstaller>=6.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
